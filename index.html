<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overlay">
<meta name="theme-color" content="#0b0d0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Camera Overlay</title>
<style>
  :root{--bg:#0b0d0c;--panel:rgba(16,19,18,.86);--fg:#eef2ef;--muted:#9aa5a0;--accent:#7fd1b9;--c-op:#c4b5fd;--c-cam:#ffb86b;--c-ov:#7fd1b9;color-scheme:dark}
  [hidden]{display:none!important}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.3 system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #ovw{position:absolute;left:50%;top:50%;transform-origin:center;pointer-events:none}
  #ov{display:block;width:100%;height:100%;user-select:none}
  #ov:not([src]){visibility:hidden}
  /* Visibility styles: contrast is a CSS filter; outline swaps in an edge-detected image */
  #ov.contrast,#ref.contrast{filter:grayscale(1) contrast(2.2)}
  /* Reference points: drawn in image coordinates, sized per view so they stay the same on screen */
  .pts{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .pts .seg{fill:none}
  .pts .segs{stroke:rgba(0,0,0,.65);fill:none}
  .pts .dot{stroke:#111}
  .pts .circ{fill:none;stroke:#fff}
  .pts .circs{fill:none;stroke:rgba(0,0,0,.65)}
  .pts .handle{fill:#fff;stroke:#111}
  .pts text{fill:#fff;stroke:rgba(0,0,0,.8);paint-order:stroke;font-family:system-ui,-apple-system,sans-serif;font-weight:600}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);z-index:5}
  #start h1{font-size:22px;margin:0}
  #start p{color:var(--muted);margin:0;max-width:30ch}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);backdrop-filter:blur(8px);
       padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
       display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;align-items:center}
  .row label{font-size:12px;color:var(--muted);width:76px;flex:none;text-transform:uppercase;letter-spacing:.04em}
  input[type=range]{flex:1;accent-color:var(--accent)}
  button,.btn{flex:1;min-height:42px;border:1px solid #2c3431;background:#1a1f1d;color:var(--fg);border-radius:10px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  button.on{background:var(--accent);color:#08110e;border-color:var(--accent)}
  .big{flex:none;padding:0 22px;background:var(--accent);color:#08110e;border:0}
  input[type=file]{display:none}
  #hint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
  #err{color:#ff9b8a;max-width:32ch}
  #grid{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #grid *{vector-effect:non-scaling-stroke;fill:none}
  #grid .sh{stroke:rgba(0,0,0,.6);stroke-width:3}
  #grid .ln{stroke:#fff;stroke-width:1}
  #grid .c{stroke:var(--accent);stroke-dasharray:6 6}
  .row button,.row .btn{min-width:0;padding:0 4px;font-size:13px;white-space:nowrap}
  .row label.btn{width:auto;flex:1;text-transform:none;letter-spacing:0;color:var(--fg);font-size:13px}
  @media (max-width:340px){.row button,.row label.btn{font-size:12px}}
  .zooms button{font-size:13px}
  .zooms{justify-content:center;gap:6px}
  .zooms button{flex:none;width:40px;min-height:34px;border-radius:999px;font-size:13px;padding:0}
  .zooms button:disabled{opacity:.3}
  /* Image only: the original image shown straight as a reference; overlay adjustments are kept */
  #ref{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg);z-index:6;display:none}
  body.solo #ref{display:block}
  body.solo #bar,body.solo #hint,body.solo #vs,body.solo #tools,body.solo #views,body.solo #menu,body.solo #more{display:none!important}
  /* Image only has its own zoom and pan, never the overlay's rotation or tilt */
  #ref{transform-origin:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
  /* Image only toolbar: fit to screen (when zoomed) and reference point editing */
  #refbar{position:fixed;z-index:8;top:calc(12px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));display:none;gap:8px;flex-wrap:wrap;
          max-width:calc(100vw - 24px)}
  body.vsleft #refbar{left:auto;right:max(12px,env(safe-area-inset-right));justify-content:flex-end}
  body.btnbottom #refbar{top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px)}
  body.solo #refbar{display:flex}
  #refbar button{flex:none;min-height:48px;padding:0 16px;border-radius:999px;font-size:15px;background:var(--panel);backdrop-filter:blur(8px)}
  #refbar button.on{background:#ffd84d;color:#111;border-color:#ffd84d}
  #refbar button:disabled{opacity:.4}
  body:not(.refzoomed) #reffit{display:none}
  /* Show/hide marks in image only mode; while editing they are always shown */
  body.ptsedit #refmarks{display:none}
  body:not(.ptsedit) #ptsnew,body:not(.ptsedit) #ptsundo,body:not(.ptsedit) #ptsdel,body:not(.ptsedit) #tooltog{display:none}
  /* Delete mode: only deleting is possible; Clear (delete all) is offered only here */
  body:not(.ptsdel) #ptsclear,body.ptsdel #tooltog,body.ptsdel #ptsnew{display:none}
  #refbar #ptsdel.on,#refbar #ptsclear{background:#e5484d;color:#fff;border-color:#e5484d}
  body.toolcircle #ptsnew{display:none}
  /* Crop screen: the full original image with a movable, resizable crop box */
  #crop{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
  #cropstage{position:relative;overflow:hidden;flex:1;margin:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
  #cropimg{display:block;max-width:100%;max-height:100%;pointer-events:none;-webkit-user-drag:none}
  #cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);pointer-events:none}
  #cropbox i{position:absolute;width:26px;height:26px;border:4px solid #fff}
  #cropbox .tl{left:-6px;top:-6px;border-right:0;border-bottom:0}
  #cropbox .tr{right:-6px;top:-6px;border-left:0;border-bottom:0}
  #cropbox .bl{left:-6px;bottom:-6px;border-right:0;border-top:0}
  #cropbox .br{right:-6px;bottom:-6px;border-left:0;border-top:0}
  #cropbar{position:relative;z-index:1;display:flex;gap:8px;padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
  #cropbar button{flex:1;min-height:52px;font-size:16px;border-radius:12px}
  #cropbar .primary{background:var(--accent);color:#08110e;border-color:var(--accent);font-weight:600}
  #ptsref{position:fixed;inset:0;width:100%;height:100%;z-index:7;display:none;transform-origin:center;pointer-events:none}
  body.solo #ptsref{display:block}
  body.novs #vs,body.novs #bar,body.novs #menu{display:none!important}
  /* Two button groups: the view toggles (overlay, image only) are big, in the top corner above the slider;
     the tools (menu, flashlight, grid, lock, slider) form a column in the opposite corner.
     --sb = tool button size, --bb = view toggle size */
  :root{--sb:48px;--bb:66px;
        --rowtop:calc(12px + env(safe-area-inset-top));--rowbot:calc(max(var(--barh,0px),env(safe-area-inset-bottom)) + 12px)}
  #tools,#views{position:fixed;top:var(--rowtop);z-index:4;display:flex;gap:8px}
  #tools{left:max(12px,env(safe-area-inset-left));flex-direction:column}
  #views{right:max(12px,env(safe-area-inset-right))}
  body.vsleft #tools{left:auto;right:max(12px,env(safe-area-inset-right))}
  body.vsleft #views{right:auto;left:max(12px,env(safe-area-inset-left))}
  /* Buttons at the bottom (setting), above the zoom presets */
  body.btnbottom #tools,body.btnbottom #views{top:auto;bottom:var(--rowbot)}
  body.btnbottom #tools{flex-direction:column-reverse}
  /* Extra space between tool subgroups: menu | grid, flashlight | lock */
  #tools .gs{margin-top:16px}
  body.btnbottom #tools .gs{margin-top:0;margin-bottom:16px}
  .btngroup button{flex:none;width:var(--sb);height:var(--sb);min-height:0;padding:0;border-radius:999px;font-size:calc(var(--sb)*.48);
                   background:var(--panel);backdrop-filter:blur(8px);border-color:rgba(255,255,255,.12)}
  .btngroup button.on{background:var(--accent);color:#08110e;border-color:var(--accent)}
  #views{align-items:center}
  #views button{width:var(--bb);height:var(--bb);font-size:calc(var(--bb)*.5)}
  #views .primary{border:2px solid var(--accent)}
  #hint{top:calc(var(--rowtop) + var(--bb) + 10px)!important;max-width:calc(100vw - 150px)}
  body.btnbottom #hint{top:var(--rowtop)!important}
  #vs{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(var(--rowtop) + var(--bb) + 10px);bottom:var(--rowbot);
      width:56px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;
      background:var(--panel);backdrop-filter:blur(8px);border-radius:28px}
  body.btnbottom #vs{top:var(--rowtop);bottom:calc(var(--rowbot) + var(--bb) + 10px)}
  #menu{position:fixed;z-index:5;top:calc(var(--rowtop) + var(--bb) + 10px);right:calc(max(10px,env(safe-area-inset-right)) + 64px);
        width:min(214px,calc(100vw - 92px));max-height:calc(100dvh - var(--rowtop) - var(--bb) - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:9px;background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;
        box-shadow:0 4px 18px rgba(0,0,0,.4)}
  body.vsleft #menu{right:auto;left:calc(max(10px,env(safe-area-inset-left)) + 64px)}
  body.btnbottom #menu{top:var(--rowtop)}
  /* The ⋯ menu opens beside the tool column */
  #more{position:fixed;z-index:5;top:var(--rowtop);left:calc(max(12px,env(safe-area-inset-left)) + var(--sb) + 8px);
        width:min(240px,calc(100vw - 92px));display:flex;flex-direction:column;padding:10px;background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;
        box-shadow:0 4px 18px rgba(0,0,0,.4)}
  body.vsleft #more{left:auto;right:calc(max(12px,env(safe-area-inset-right)) + var(--sb) + 8px)}
  body.btnbottom #more{top:auto;bottom:var(--rowbot)}
  #mmain,#msettings{display:flex;flex-direction:column;gap:8px}
  #more button{flex:none;min-height:54px;justify-content:flex-start;padding:0 16px;font-size:17px;border-radius:12px}
  #more .danger{color:#ff8a8a}
  #more .back{color:var(--muted);border-color:transparent;background:none}
  /* Line icons (inline SVG): color follows the button state */
  .ic{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  #vslock .ic,#menu .glock .ic{width:22px;height:22px}
  #menu .mh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 6px 2px}
  #menu button{flex:none;min-height:46px;justify-content:flex-start;padding:0 14px;font-size:16px}
  #mparams{display:flex;flex-direction:column;gap:5px}
  #menu .sep{height:1px;background:rgba(255,255,255,.12);margin:4px 2px}
  #menu button:disabled,.zooms button:disabled{opacity:.35}
  body.vsleft #vs{right:auto;left:max(10px,env(safe-area-inset-left))}
  #vsmenu{flex:none;width:52px;min-height:44px;padding:2px 0;border-radius:14px;flex-direction:column;gap:0;font-size:10px;letter-spacing:-.01em;white-space:nowrap;line-height:1.15;text-align:center}
  #vsmenu.on{background:#2c3431}
  #vsval{font-size:13px;font-variant-numeric:tabular-nums;min-height:17px}
  #vstrack{position:relative;flex:1;width:100%;touch-action:none;cursor:ns-resize}
  #vstrack::before{content:'';position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;background:#2c3431;border-radius:2px}
  /* Slider color by group: opacity, camera, overlay image */
  .g-op{--gc:var(--c-op)} .g-cam{--gc:var(--c-cam)} .g-ov{--gc:var(--c-ov)}
  #vsfill{position:absolute;left:50%;width:4px;margin-left:-2px;background:var(--gc);border-radius:2px}
  #vszero{position:absolute;left:50%;width:20px;height:2px;margin:-1px 0 0 -10px;background:var(--muted)}
  #vsthumb{position:absolute;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--gc);box-shadow:0 1px 5px rgba(0,0,0,.5)}
  #vs0,#vslock{flex:none;width:44px;min-height:32px;font-size:12px;padding:0}
  #vslock{font-size:16px}
  #vs{border:2px solid var(--gc)}
  #vsname{color:var(--gc)}
  /* A locked group: the slider cannot be dragged */
  #vs.locked #vstrack{opacity:.3;cursor:not-allowed}
  #vs.locked #vslock{background:var(--gc);color:#08110e;border-color:var(--gc)}
  #menu [data-p],#menu #flip,#menu #linecol{border-left:4px solid var(--gc)}
  #stylesel{display:flex;gap:4px}
  #menu #stylesel button{flex:1;min-height:40px;padding:0;justify-content:center;font-size:13px;border-color:rgba(255,255,255,.12)}
  #menu #stylesel button.on{background:var(--gc);color:#08110e;border-color:var(--gc)}
  #menu [data-p].on{background:var(--gc);color:#08110e;border-color:var(--gc)}
  #menu .mh{display:flex;align-items:center;justify-content:space-between;color:var(--gc)}
  #menu .glock{width:46px;min-height:38px;padding:0;justify-content:center;font-size:16px}
  #menu .glock.on{background:var(--gc);border-color:var(--gc)}
  .zooms button.on{background:var(--c-cam);border-color:var(--c-cam)}
  /* Phone in landscape: the slider runs horizontally along the bottom, between the tool column and the view toggles */
  @media (orientation:landscape) and (max-height:520px){
    #vs{top:auto;bottom:var(--rowbot);left:calc(max(12px,env(safe-area-inset-left)) + var(--sb) + 14px);right:max(12px,env(safe-area-inset-right));
        width:auto;height:60px;flex-direction:row;padding:0 10px;gap:8px}
    body.vsleft #vs{left:max(12px,env(safe-area-inset-left));right:calc(max(12px,env(safe-area-inset-right)) + var(--sb) + 14px)}
    body.btnbottom #vs{top:auto;bottom:var(--rowbot);right:calc(max(12px,env(safe-area-inset-right)) + 3 * var(--bb) + 30px)}
    body.btnbottom.vsleft #vs{left:calc(max(12px,env(safe-area-inset-left)) + 3 * var(--bb) + 30px);right:calc(max(12px,env(safe-area-inset-right)) + var(--sb) + 14px)}
    #vsval{min-width:46px;text-align:center}
    #vstrack{width:auto;height:100%;cursor:ew-resize}
    #vstrack::before{left:14px;right:14px;top:50%;bottom:auto;width:auto;height:4px;margin:-2px 0 0}
    #vsfill{top:50%;width:auto;height:4px;margin:-2px 0 0}
    #vszero{top:50%;width:2px;height:20px;margin:-10px 0 0 -1px}
    #vsthumb{top:50%}
    /* The adjustment menu opens above the slider */
    #menu,body.btnbottom #menu{top:auto;bottom:calc(var(--rowbot) + 68px);left:calc(max(12px,env(safe-area-inset-left)) + var(--sb) + 14px);right:auto;
          max-height:calc(100dvh - var(--rowbot) - 80px - env(safe-area-inset-top))}
    body.vsleft #menu{left:max(12px,env(safe-area-inset-left))}
  }
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline autoplay muted></video>
  <div id="ovw">
    <img id="ov" alt="">
    <svg id="grid" hidden aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none">
      <g class="sh"><rect x="0" y="0" width="100" height="100"/><line x1="33.333" y1="0" x2="33.333" y2="100"/><line x1="0" y1="33.333" x2="100" y2="33.333"/><line x1="66.667" y1="0" x2="66.667" y2="100"/><line x1="0" y1="66.667" x2="100" y2="66.667"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></g>
      <g class="ln"><rect x="0" y="0" width="100" height="100"/><line x1="33.333" y1="0" x2="33.333" y2="100"/><line x1="0" y1="33.333" x2="100" y2="33.333"/><line x1="66.667" y1="0" x2="66.667" y2="100"/><line x1="0" y1="66.667" x2="100" y2="66.667"/></g>
      <g class="ln c"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></g>
    </svg>
    <svg id="ptsov" class="pts" hidden aria-hidden="true"></svg>
  </div>
</div>

<div id="start">
  <h1>Camera Overlay</h1>
  <p>Pick an image to show semi-transparently on top of the camera view.</p>
  <button class="big" id="go">Start camera</button>
  <p id="err"></p>
</div>

<img id="ref" alt="" draggable="false">
<svg id="ptsref" class="pts" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
<div id="refbar">
  <button id="reffit">⤢ Fit</button>
  <button id="cropb">✂ Crop</button>
  <button id="refstyle">Style: Normal</button>
  <button id="refmarks" class="on" aria-pressed="true">◉ Marks + ratios</button>
  <button id="ptsedit">✎ Edit</button>
  <button id="tooltog">• Points</button>
  <button id="ptsnew">+ Chain</button>
  <button id="ptsundo">Undo</button>
  <button id="ptsdel" aria-pressed="false">🗑 Delete</button>
  <button id="ptsclear">Clear all</button>
</div>

<!-- Tool buttons: a column in the corner opposite the slider, in subgroups (.gs starts a subgroup): menu | grid, points, flashlight | lock -->
<div id="tools" class="btngroup" hidden>
  <button id="moreb" aria-label="Menu" aria-haspopup="menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg></button>
  <button id="gridb" class="gs" aria-label="Grid lines on/off" title="Grid lines" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg></button>
  <button id="ptsb" aria-label="Reference points on/off" title="Points" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.2 16 4.6-8.3M13.4 7.5l4.4 6.6"/><circle cx="5" cy="18" r="2.2"/><circle cx="12" cy="5.5" r="2.2"/><circle cx="19" cy="16" r="2.2"/></svg></button>
  <button id="torchb" hidden aria-label="Flashlight on/off" title="Flashlight" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6l1-8z"/></svg></button>
  <button id="lock" class="gs" aria-label="Lock image" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/></svg></button>
</div>
<!-- Big toggles in the corner above the slider: slider, overlay, image only -->
<div id="views" class="btngroup" hidden>
  <button id="vshide" class="on" aria-label="Show/hide slider" title="Slider" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M12 3v18M18 3v18"/><circle cx="6" cy="8" r="2.2" fill="currentColor"/><circle cx="12" cy="15" r="2.2" fill="currentColor"/><circle cx="18" cy="10" r="2.2" fill="currentColor"/></svg></button>
  <button id="ovb" class="on" aria-label="Overlay on/off" title="Overlay" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 8 12 13l9.5-5L12 3z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5" opacity=".5"/></svg></button>
  <button id="solob" class="primary" aria-label="Image only" title="Image only"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m21 16-5-5-9 9"/></svg></button>
</div>

<div id="hint" hidden>Drag = move · pinch = size and rotation</div>

<!-- Bottom bar: camera zoom presets, shown only while the zoom setting is selected -->
<div id="bar" hidden>
  <div class="row zooms" id="zooms"></div>
</div>
<input id="file" type="file" accept="image/*">

<script>
const $=id=>document.getElementById(id);
const v=$('v'),ov=$('ov'),ovw=$('ovw'),grid=$('grid');
// Size of the image frame; without an image the grid gets a screen-sized frame
function setFrame(w,h){ovw.style.width=w+'px';ovw.style.height=h+'px'}
setFrame(innerWidth*.8,innerHeight*.6);
const s={x:0,y:0,scale:1,rot:0,tx:0,ty:0,flip:1,lockCam:false,lockOv:false,facing:'environment',zoom:1};
let stream,track,curDev=null,devs=[];
const ZOOMS=[0.5,1,2,3,5];

function draw(){
  ovw.style.transform=`translate(-50%,-50%) translate(${s.x}px,${s.y}px) perspective(${Math.max(innerWidth,innerHeight)}px) rotateX(${s.tx}deg) rotateY(${s.ty}deg) rotate(${s.rot}deg) scale(${s.scale*s.flip},${s.scale})`;
  save();refreshVS();drawPts();
}
// Persistence: image and settings in IndexedDB, restored on the next start
const KEYS=['x','y','scale','rot','tx','ty','flip','zoom','op','side','param','btnpos','rz','rx','ry','lockCam','lockOv','style','rstyle','edge','line','chains','chain','circles','showPts','refPts','ratios','fv','crop'];
// Visibility style and reference points (normalized image coordinates)
s.style='normal';s.rstyle='normal';s.edge=40;s.line='dark';s.chains=[];s.chain=0;s.circles=[];s.showPts=false;s.refPts=true;s.ratios=true;

s.rz=1;s.rx=0;s.ry=0;
s.side='right';s.param='op';s.btnpos='top';
s.op=.5;
// fv: frame version. 1 = s.scale is relative to the downsized frame (FW×FH), not the original image size

// Crop of the original image, normalized [x, y, w, h]; the original stays stored so the crop can be changed later

let saveT;
function save(){

}

    if(!('fv' in o)){scaleFix=true;s.fv=1}

    if(!o.chains&&o.pts?.length){s.chains=[o.pts];s.chain=0}
  }catch(e){}
}
// The original image is kept separately; the overlay shows it or a processed (outline) version of it

// element is rendered as a layer of its full layout size. iOS reloads the page when it runs out of memory,

const MAXPX=2400,FRAME=800;
let origURL=null,srcImg=null,IW=0,IH=0,FW=0,FH=0;

async function loadImage(){

}
function syncUI(){

function fitImage(){
  const w=innerWidth*0.8/FW,h=innerHeight*0.6/FH;
  s.scale=Math.min(w,h);s.x=0;s.y=0;s.rot=0;s.tx=0;s.ty=0;draw();
}

// Lenses: on iPhone each back camera is its own device (ultra wide, wide, tele).
// Labels may be localized, so Finnish variants are matched too.
const isUltra=d=>/ultra/i.test(d.label);
const isFront=d=>/front|etu|user/i.test(d.label);
function pickDevice(){
  if(s.facing==='user')return null;
  const back=devs.filter(d=>!isFront(d));
  if(s.zoom<1){const u=back.find(isUltra);if(u)return u}
  return back.find(d=>!isUltra(d)&&!/tele|dual|triple|kaksois|kolmois/i.test(d.label))||null;
}
async function openCam(dev){

  if(dev)video.deviceId={exact:dev.deviceId};else video.facingMode=s.facing;
  stream=await navigator.mediaDevices.getUserMedia({video,audio:false});

  v.srcObject=stream;
  try{await v.play()}catch(e){}
  await syncTorch();
}
// Flashlight: shown only when the current camera supports torch; reapplied after the camera is reopened
s.torch=false;
async function syncTorch(){
  const ok=!!track?.getCapabilities?.().torch,b=$('torchb');
  b.hidden=!ok;
  if(ok&&s.torch){try{await track.applyConstraints({advanced:[{torch:true}]})}catch(e){s.torch=false}}
  b.classList.toggle('on',ok&&s.torch);b.setAttribute('aria-pressed',ok&&s.torch);
}
$('torchb').onclick=async()=>{
  s.torch=!s.torch;
  try{await track.applyConstraints({advanced:[{torch:s.torch}]})}catch(e){s.torch=false}
  syncTorch();
};
async function startCam(){
  await openCam(null);
  try{devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){}

  await setZoom(s.zoom,true);
}
// Zoom: switch lens if needed, then hardware zoom, the rest digitally
async function setZoom(z,reopen){
  // Camera closed: just remember the zoom for when it is opened again
  if(!stream){s.zoom=z;save();refreshVS();return}
  s.zoom=z;save();
  const dev=pickDevice();
  if(reopen||dev?.deviceId!==curDev?.deviceId)await openCam(dev);
  let f=dev&&isUltra(dev)?z/0.5:z,hw=1;
  const c=track.getCapabilities?.().zoom;
  if(c){hw=Math.min(Math.max(f,c.min),c.max);try{await track.applyConstraints({advanced:[{zoom:hw}]})}catch(e){hw=1}}
  const digital=Math.max(1,f/hw);
  v.style.transform=(s.facing==='user'?'scaleX(-1) ':'')+`scale(${digital})`;
  refreshVS();
  for(const b of $('zooms').children)b.classList.toggle('on',+b.dataset.z===z);
}
function minZoom(){
  if(s.facing==='environment'&&devs.some(d=>!isFront(d)&&isUltra(d)))return 0.5;
  return Math.min(1,track?.getCapabilities?.().zoom?.min??1);

function buildZooms(){
  const box=$('zooms'),mn=minZoom();box.innerHTML='';
  if(s.zoom<mn)s.zoom=1;
  for(const z of ZOOMS){
    if(z<mn)continue;
    const b=document.createElement('button');b.dataset.z=z;b.textContent=(z<1?'.5':z)+'×';
    b.onclick=()=>setZoom(z);b.disabled=s.lockCam;box.append(b);

let starting=false;
$('go').onclick=async()=>{
  // Guard against a tap on Start while the automatic start is still running (it would open the camera twice)
  if(starting||stream)return;starting=true;
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('This browser cannot use the camera here. Open the page over https.');
    await loadState();syncUI();
    await startCam();
    $('start').hidden=true;$('tools').hidden=false;$('views').hidden=false;vs.hidden=false;pick(s.param);$('hint').hidden=false;
    setTimeout(()=>$('hint').hidden=true,4000);
    try{await navigator.wakeLock?.request('screen')}catch(e){}
    if(!await loadImage())$('file').click();
  }catch(e){$('err').textContent='Camera did not start: '+(e.message||e.name)}
  finally{starting=false}
};

$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  // Points belong to the previous image
  s.chains=[];s.chain=0;s.circles=[];s.crop=[0,0,1,1];
  showImage(f,true);

ov.style.opacity=.5;
// Overlay on/off: settings are kept, one tap switches to the plain camera view
function setOverlay(on){ov.hidden=!on;$('ovb').classList.toggle('on',on);$('ovb').setAttribute('aria-pressed',on)}
$('ovb').onclick=()=>setOverlay(ov.hidden);
$('solob').onclick=()=>{if(!origURL)return $('file').click();document.body.classList.add('solo');applyRefStyle();drawPts()};
// Image only: own zoom (pinch, wheel) and pan (drag); a tap without moving returns to the overlay
const ref=$('ref');
function drawRef(){
  ref.style.transform=$('ptsref').style.transform=`translate(${s.rx}px,${s.ry}px) scale(${s.rz})`;
  document.body.classList.toggle('refzoomed',s.rz>1.01);
}
function setRef(z,x,y){

}
$('reffit').onclick=()=>setRef(1,0,0);
const rp=new Map();let rg=null;
function refSnap(){

    if(delMode){if(isTap){deleteAt(e.clientX,e.clientY);drawPts();save()}}

    }
    else if(isTap){tapPoint(dragPt,e.clientX,e.clientY);drawPts();save()}

// Visibility: normal, high contrast, or outline (edges drawn in a chosen color on a transparent background)
const LINE={dark:[17,17,17],white:[255,255,255],red:[235,40,80]},LINENAME={dark:'Dark',white:'White',red:'Red'};
let styleT,ovOutline=null;
function syncStyleUI(){
  for(const b of $('stylesel').children)b.classList.toggle('on',b.dataset.st===s.style);
  const o=s.style==='outline';
  document.querySelector('#menu [data-p="edge"]').hidden=!o;$('linecol').hidden=!o;
  $('linecol').textContent='Line color: '+LINENAME[s.line];
}
function applyStyle(){
  syncStyleUI();
  ov.classList.toggle('contrast',s.style==='contrast');
  if(!srcImg)return;
  clearTimeout(styleT);
  if(s.style!=='outline'){if(ov.src!==origURL)ov.src=origURL;return}
  styleT=setTimeout(async()=>{
    const u=await outlineURL(LINE[s.line]);if(!u)return;
    if(ovOutline)URL.revokeObjectURL(ovOutline);ovOutline=u;

// Returns a blob URL of the outline image; the caller revokes the previous one
async function outlineURL(col,bg){
  const k=Math.min(1,1200/Math.max(IW,IH)),w=Math.round(IW*k),h=Math.round(IH*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(srcImg,0,0,w,h);
  let d;try{d=g.getImageData(0,0,w,h)}catch(e){return null}
  const p=d.data,L=new Float32Array(w*h),A=new Float32Array(w*h),[cr,cg,cb]=col,t=s.edge;
  for(let i=0,j=0;i<L.length;i++,j+=4)L[i]=.299*p[j]+.587*p[j+1]+.114*p[j+2];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let a=0;
    if(x>0&&y>0&&x<w-1&&y<h-1){
      // Sobel gradient
      const i=y*w+x,tl=L[i-w-1],tc=L[i-w],tr=L[i-w+1],ml=L[i-1],mr=L[i+1],bl=L[i+w-1],bc=L[i+w],br=L[i+w+1];

  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let a=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<h&&xx>=0&&xx<w){const v=A[yy*w+xx];if(v>a)a=v}}
    const j=(y*w+x)*4;
    if(bg){const k=a/255;p[j]=bg[0]+(cr-bg[0])*k;p[j+1]=bg[1]+(cg-bg[1])*k;p[j+2]=bg[2]+(cb-bg[2])*k;p[j+3]=255}
    else{p[j]=cr;p[j+1]=cg;p[j+2]=cb;p[j+3]=a}

  return b?URL.createObjectURL(b):null;
}

const RSTYLE={normal:'Style: Normal',contrast:'Style: Contrast',outline:'Style: Outline'};
let refOutlineStale=true,refOutline=null;
function applyRefStyle(){
  $('refstyle').textContent=RSTYLE[s.rstyle];

  const A=C[0],first=s.ratios&&A?.length>1?Math.hypot(A[1][0]-A[0][0],A[1][1]-A[0][1]):0;

  s.circles.forEach(([x,y,rr])=>{

    if(first)h+=`<text fill="#fff" x="${X+4*u}" y="${Y-R-6*u}" font-size="${13*u}" stroke-width="${3*u}">⌀${+(2*R/first).toFixed(2)}</text>`;
    if(showActive&&tool==='circle')h+=`<circle class="handle" cx="${X}" cy="${Y}" r="${5*u}" stroke-width="${1.5*u}"/><circle class="handle" cx="${X+R}" cy="${Y}" r="${6*u}" stroke-width="${1.5*u}"/>`;

      const txt=first?(+(len/first).toFixed(2)).toString():'';

    }

// Lock icon shackle: open or closed
const LOCK_OPEN='M8 10.5V7a4 4 0 0 1 7.6-1.7',LOCK_CLOSED='M8 10.5V7a4 4 0 0 1 8 0v3.5';
const groupLocked=g=>g==='cam'?s.lockCam:g==='ov'?s.lockOv:false;
function setLock(g,on){if(g==='cam')s.lockCam=on;else s.lockOv=on;syncLocks();save()}
function syncLocks(){
  const mark=(b,on)=>{b.querySelector('path').setAttribute('d',on?LOCK_CLOSED:LOCK_OPEN);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)};
  mark($('lock'),s.lockOv);
  for(const b of document.querySelectorAll('.glock'))mark(b,groupLocked(b.dataset.g));
  for(const z of $('zooms').children)z.disabled=s.lockCam;
  $('flip').disabled=s.lockOv;
  if(cur){const l=groupLocked(P[cur].g);vs.classList.toggle('locked',l);mark($('vslock'),l);$('vs0').disabled=l}
}
$('lock').onclick=()=>setLock('ov',!s.lockOv);
for(const b of document.querySelectorAll('.glock'))b.onclick=()=>setLock(b.dataset.g,!groupLocked(b.dataset.g));
$('vslock').onclick=()=>setLock(P[cur].g,!groupLocked(P[cur].g));
$('gridb').onclick=()=>{const on=!grid.toggleAttribute('hidden');$('gridb').classList.toggle('on',on);$('gridb').setAttribute('aria-pressed',on)};

// Touch gestures: one finger moves, two fingers scale and rotate
// Movable while the image, the grid or the reference marks are visible (marks alone are enough when the image is hidden)
const editable=()=>(ov.src&&!ov.hidden)||!grid.hasAttribute('hidden')||(s.showPts&&(s.chains.length>0||s.circles.length>0));
const pts=new Map();let g=null;
const stage=$('stage');
function snapshot(){
  const a=[...pts.values()];
  if(a.length===1)g={type:1,px:a[0].x,py:a[0].y,x:s.x,y:s.y};
  else if(a.length>=2){const[p,q]=a;g={type:2,d:Math.hypot(q.x-p.x,q.y-p.y),ang:Math.atan2(q.y-p.y,q.x-p.x),cx:(p.x+q.x)/2,cy:(p.y+q.y)/2,scale:s.scale,rot:s.rot,x:s.x,y:s.y}}
  else g=null;
}
stage.addEventListener('pointerdown',e=>{if(s.lockOv||!editable())return;stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});snapshot()});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!g)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...pts.values()];
  if(g.type===1&&a.length===1){s.x=g.x+a[0].x-g.px;s.y=g.y+a[0].y-g.py}
  else if(g.type===2&&a.length>=2){const[p,q]=a;
    s.scale=Math.max(.05,g.scale*Math.hypot(q.x-p.x,q.y-p.y)/g.d);
    s.rot=g.rot+(Math.atan2(q.y-p.y,q.x-p.x)-g.ang)*180/Math.PI;
    s.rot=snap(((s.rot+540)%360)-180);
    s.x=g.x+(p.x+q.x)/2-g.cx;s.y=g.y+(p.y+q.y)/2-g.cy}
  draw();
});
const up=e=>{pts.delete(e.pointerId);snapshot()};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
// Mouse wheel on desktop
stage.addEventListener('wheel',e=>{if(s.lockOv||!editable())return;e.preventDefault();s.scale=Math.max(.05,s.scale*(e.deltaY<0?1.08:0.93));draw()},{passive:false});
// Installable app: offline support via the service worker
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
// Start straight away when camera access is already granted; otherwise the start screen asks first
(async()=>{try{if((await navigator.permissions?.query({name:'camera'}))?.state==='granted')$('go').click()}catch(e){}})();
</script>
</body>
